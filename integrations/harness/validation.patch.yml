# M0 only: real runtime, no tools, loopback fixture model, isolated home.
- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: deepseek-llm-api-extensions
  disabled: true
- id: sandbox
  disabled: true
- id: sandbox-policy
  disabled: true
- id: subprocess
  disabled: true
- id: pty
  disabled: true
- id: terminal-bash
  disabled: true
- id: terminal-pwsh
  disabled: true
- id: persistent-bash
  disabled: true
- id: persistent-pwsh
  disabled: true
- id: str-replace-editor
  disabled: true
- id: fs-local
  disabled: true
- id: llm-deepseek
  config:
    apiKeyEnv: CLIPVAULT_M0_FAKE_KEY
    baseURL: !!js process.env.CLIPVAULT_M0_BASE_URL
    maxTokens: 64
    streamIdleTimeoutMs: 2000
