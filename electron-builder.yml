appId: com.clipvault.app
productName: ClipVault
directories:
  buildResources: build
icon: resources/icon-square.png
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**/*.node
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
# v3.0 个人本地版：不再打包 Tailscale / node-datachannel / transformers
win:
  executableName: ClipVault
  icon: resources/icon.ico
  target:
    - nsis
  signAndEditExecutable: false
  # TASK-084 代码签名占位（详见 docs/release/signing-setup.md）
  # 实际签名由 scripts/sign.js 在 release pipeline 中调用，支持本地 pfx 与 Azure Key Vault HSM
  publisherName: "ClipVault"
  # TASK-084 代码签名占位（详见 docs/release/signing-setup.md）
  # 注：electron-builder v24 扁平结构；v25+ 的 signtoolOptions 嵌套语法需升级后启用
  signingHashAlgorithms:
    - sha256
  # 证书材料通过环境变量注入：
  #   CSC_LINK / CSC_KEY_PASSWORD        （本地 pfx 模式）
  #   AZURE_KEY_VAULT_URI / AZURE_CERT_NAME / AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_CLIENT_SECRET （HSM 模式）
  # rfc3161TimeStampServer: http://timestamp.digicert.com
afterPack: scripts/afterPack.js
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    # v2.0 Sprint 2+3：mDNS 局域网服务发现（macOS 14+ 必须声明，否则沙盒下静默失败）
    - NSBonjourServices:
        - _clipvault._tcp
    - NSLocalNetworkUsageDescription: ClipVault 需要访问局域网以发现和同步您的其他设备。
  notarize: false
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: clipvault
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# GitHub Releases（electron-updater / scripts/release.js）
# 仓库：https://github.com/dzcnice/clipvault
publish:
  provider: github
  owner: dzcnice
  repo: clipvault
  releaseType: release
