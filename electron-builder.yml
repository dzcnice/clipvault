appId: com.clipvault.app
productName: ClipVault
directories:
  buildResources: build
icon: resources/icon-square-v3.png
# 体积：Electron 运行时占大头；下列规则尽量去掉无用语言包与开发残留
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}'
  - '!**/node_modules/*/{test,tests,__tests__,docs,doc,example,examples,demo}/**'
  - '!**/node_modules/.bin/**'
  - '!**/*.{map,md,markdown}'
  - '!dist-types{,/**}'
  - '!dist-types-web{,/**}'
  - '!coverage{,/**}'
  - '!docs{,/**}'
  - '!e2e{,/**}'
  - '!test-fixtures{,/**}'
  - '!test-setup{,/**}'
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**/*.node
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
# 仅保留中英文 Chromium 语言包（完整 locales 约 40MB+）
electronLanguages:
  - en-US
  - zh-CN
# v3.0 个人本地版：不再打包 Tailscale / node-datachannel / transformers
win:
  executableName: ClipVault
  icon: resources/icon-v3.ico
  target:
    - nsis
  signAndEditExecutable: false
  # TASK-084 代码签名占位（详见 docs/release/signing-setup.md）
  # 实际签名由 scripts/sign.js 在 release pipeline 中调用，支持本地 pfx 与 Azure Key Vault HSM
  publisherName: "ClipVault"
  # TASK-084 代码签名占位（详见 docs/release/signing-setup.md）
  # 注：electron-builder v24 扁平结构；v25+ 的 signtoolOptions 嵌套语法需升级后启用
  signingHashAlgorithms:
    - sha256
  # 证书材料通过环境变量注入：
  #   CSC_LINK / CSC_KEY_PASSWORD        （本地 pfx 模式）
  #   AZURE_KEY_VAULT_URI / AZURE_CERT_NAME / AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_CLIENT_SECRET （HSM 模式）
  # rfc3161TimeStampServer: http://timestamp.digicert.com
afterPack: scripts/afterPack.js
# NSIS：同 appId 覆盖升级；保留 %APPDATA% 用户库；见 build/installer.nsh
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  artifactName: ${name}-${version}-setup.${ext}
  include: build/installer.nsh
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: ClipVault 需要访问文稿以导入、导出和备份。
    - NSDownloadsFolderUsageDescription: ClipVault 需要访问下载目录以导入导出文件。
  notarize: false
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: clipvault
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# GitHub Releases（electron-updater / scripts/release.js）
# 仓库：https://github.com/dzcnice/clipvault
publish:
  provider: github
  owner: dzcnice
  repo: clipvault
  releaseType: release
