openapi: 3.1.0
info:
  title: ClipVault Local HTTP API
  version: 1.0.0
  description: |
    【已下线】ClipVault v3 个人版不再提供本地 HTTP API。
    本文档仅作历史存档。
servers:
  - url: http://127.0.0.1:7424
    description: Default local port (fallback +1 when busy)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    StatusResponse:
      type: object
      properties:
        running: { type: boolean }
        unlocked: { type: boolean }
        version: { type: string }
    CredentialMeta:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        description: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        useCount: { type: integer }
        isFavorite: { type: boolean }
    ClipboardItem:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        preview: { type: string }
        size: { type: integer }
        createdAt: { type: integer }
    CopyRequest:
      type: object
      required: [credentialId]
      properties:
        credentialId: { type: string }
    ErrorResponse:
      type: object
      properties:
        error: { type: string }

security:
  - BearerAuth: []

paths:
  /v1/status:
    get:
      summary: Service status
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResponse' }

  /v1/credentials:
    get:
      summary: List credential metadata
      parameters:
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CredentialMeta' }
                  total: { type: integer }
        '401': { description: Unauthorized }
        '423': { description: Vault locked }
        '429': { description: Rate limit }

  /v1/credentials/{id}:
    get:
      summary: Get single credential metadata
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialMeta' }
        '404': { description: Not Found }

  /v1/clipboard/recent:
    get:
      summary: Recent clipboard entries (preview only)
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ClipboardItem' }

  /v1/clipboard/copy:
    post:
      summary: Copy credential value into system clipboard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CopyRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  copied: { type: boolean }
                  credentialId: { type: string }
        '404': { description: Credential not found }
        '423': { description: Vault locked }
